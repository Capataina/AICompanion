<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Companion profile card — Multi... Player?</title>
<style>
/* ------------------------------------------------------------------ *
 * Terraria's own interface language, not a generic dark UI.
 *
 * Four things carry nearly all of the resemblance, and they are worth
 * naming because a mockup that misses them reads as "a game menu" and
 * never as "Terraria":
 *   1. every string has a hard black drop shadow, offset down-right,
 *      with no blur — the game draws all UI text that way
 *   2. panels are a saturated blue-violet at ~82% over the world, so
 *      the world shows through and the panel never reads as a page
 *   3. item slots are a lighter blue with a bright thin border, square
 *   4. headings and item names are coloured by rarity, not by role
 *
 * No transitions and no keyframes anywhere, on purpose: Terraria's
 * interface does not animate, so hover and selection change instantly.
 * ------------------------------------------------------------------ */
:root{
  --panel:rgba(43,48,153,.86);
  --panel-solid:#2b3099;
  --panel-lit:#3b41bd;
  --panel-sunk:rgba(26,29,105,.9);
  --slot:#4a4eb4;
  --slot-lit:#5f64d4;
  --edge:#8f93f0;
  --edge-soft:#5f64c8;
  --ring:#12143f;
  --ink:#ffffff;
  --ink-dim:#c3c6f5;
  --ink-mute:#8f93cc;
  --gold:#ffe066;
  --green:#8cf08c;
  --red:#ff6b6b;
  --orange:#ffb04a;
  --cyan:#7ceaea;
  --ui:"Trebuchet MS","Lucida Grande",Verdana,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#0a0c14;
  color:var(--ink);
  font-family:var(--ui);
  font-size:14px;font-weight:bold;
  /* The single most recognisable Terraria text trait. Applied on body so
     every string inherits it, which is also how the game does it. */
  text-shadow:2px 2px 0 rgba(0,0,0,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:22px;min-height:100%;
}
/* The world behind the panel. Without it the 86% panel has nothing to be
   translucent against, and translucency is half of why a Terraria menu
   looks like a Terraria menu. */
#world{position:fixed;inset:0;z-index:-1;image-rendering:pixelated;width:100%;height:100%}

/* ---- the card ---------------------------------------------------- */
.card{
  width:880px;
  background:var(--panel);
  border:2px solid var(--edge-soft);
  box-shadow:0 0 0 2px var(--ring), 0 14px 44px rgba(0,0,0,.6);
  display:flex;flex-direction:column;
  position:relative;
}
.titlebar{
  display:flex;align-items:center;gap:10px;
  padding:7px 10px;border-bottom:2px solid var(--edge-soft);
  background:rgba(59,65,189,.55);
}
.titlebar h1{font-size:17px;margin:0;color:var(--gold)}
.titlebar .crumb{color:var(--ink-dim);font-size:14px}
.titlebar .spacer{flex:1}
.iconbtn{
  width:28px;height:24px;display:grid;place-items:center;
  background:var(--slot);border:1px solid var(--edge-soft);color:var(--ink-dim);
  font-size:15px;line-height:1;cursor:pointer;font-family:var(--ui);font-weight:bold;
  text-shadow:2px 2px 0 rgba(0,0,0,.85);
}
.iconbtn:hover{background:var(--slot-lit);border-color:var(--edge);color:#fff}
.view{display:none;flex-direction:column}
.view.on{display:flex}

/* ---- overview ---------------------------------------------------- */
#v-overview{padding:10px;gap:10px}
.top{display:grid;grid-template-columns:250px 1fr;gap:10px}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:136px}

.pane{background:var(--panel-sunk);border:1px solid var(--edge-soft);min-width:0}
.pane > h2{
  margin:0;padding:5px 9px;font-size:14px;color:var(--gold);
  background:rgba(59,65,189,.5);border-bottom:1px solid var(--edge-soft);
}

/* portrait */
.portrait{display:flex;flex-direction:column}
.portrait .frame{
  flex:1;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(10,12,32,.75) 0%,rgba(26,29,105,.4) 100%);
  min-height:0;padding:10px 0;
}
/* An integer upscale of the canvas, so every source pixel stays a whole
   block and the sprite keeps hard edges. */
.sprite{image-rendering:pixelated;display:block;width:144px;height:192px}
.portrait .nameplate{padding:6px 9px 2px;text-align:center}
.portrait .nameplate .nm{font-size:16px;color:var(--ink)}
.portrait .nameplate .lv{font-size:12.5px;color:var(--ink-mute)}
.hpwrap{padding:0 9px 8px}
.hpbar{height:14px;background:#4a1414;border:1px solid #8f3232;position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(180deg,#ff7b7b,#c42a2a)}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#fff}
/* The live action strip, at the foot of the portrait because what the
   companion is doing belongs with the picture of it doing it. */
.action{
  border-top:1px solid var(--edge-soft);background:rgba(59,65,189,.45);
  padding:6px 9px;text-align:right;
}
.action .k{font-size:11.5px;color:var(--ink-mute);display:block}
.action .v{font-size:15px;color:var(--gold)}
.action .why{font-size:12px;color:var(--ink-dim);display:block;line-height:1.4;font-weight:normal}

/* behaviour settings */
.behaviour{display:flex;flex-direction:column}
.behaviour .body{padding:7px 9px 10px}
.grouphead{
  font-size:12px;color:var(--ink-mute);
  margin:10px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--edge-soft);
}
.grouphead:first-child{margin-top:2px}
.row{display:grid;grid-template-columns:1fr 274px 24px;align-items:center;gap:8px;padding:3px 0}
.row .lbl{font-size:14px;color:var(--ink)}
.lbl em{font-style:normal;color:var(--ink-mute);font-size:12px;font-weight:normal}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--edge-soft)}
.seg button{
  font-family:var(--ui);font-weight:bold;font-size:12.5px;padding:4px 0;cursor:pointer;
  background:var(--slot);color:var(--ink-mute);border:0;border-right:1px solid var(--edge-soft);
  text-shadow:2px 2px 0 rgba(0,0,0,.85);
}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--slot-lit);color:#fff}
.seg button[aria-pressed="true"]{background:var(--panel-lit);color:var(--gold)}
.more{
  width:24px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:var(--slot);border:1px solid var(--edge-soft);color:var(--ink-dim);font-size:13px;
  font-family:var(--ui);font-weight:bold;text-shadow:2px 2px 0 rgba(0,0,0,.85);
}
.more:hover{background:var(--slot-lit);color:#fff;border-color:var(--edge)}
.more.ghost{visibility:hidden}

/* Follow distance is a value, not a mode, so it must not wear a mode's
   clothes: a matching three-segment control would read as a fourth
   behaviour toggle. */
.stops{display:flex;border:1px solid var(--edge-soft)}
.stops button{
  flex:1;font-family:var(--ui);font-weight:bold;font-size:12.5px;padding:4px 0;cursor:pointer;
  background:var(--slot);color:var(--ink-mute);border:0;border-right:1px solid var(--edge-soft);
  text-shadow:2px 2px 0 rgba(0,0,0,.85);
}
.stops button:last-child{border-right:0}
.stops button:hover{background:var(--slot-lit);color:#fff}
.stops button[aria-pressed="true"]{background:var(--panel-lit);color:var(--cyan)}

/* the two live weapon slots on the overview */
.wepslots{display:flex;align-items:center;gap:8px;padding:2px 0}
.wepslot{
  display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;
  background:var(--slot);border:1px solid var(--edge-soft);font-size:13.5px;min-width:186px;
}
.wepslot.empty{color:var(--ink-mute);font-weight:normal}
.wepslot .pip{width:20px;height:20px;border:1px solid rgba(0,0,0,.6)}

/* summary tiles */
.tile{
  background:var(--panel-sunk);border:1px solid var(--edge-soft);
  display:flex;flex-direction:column;cursor:pointer;text-align:left;
  font-family:var(--ui);font-weight:bold;color:var(--ink);padding:0;
  text-shadow:2px 2px 0 rgba(0,0,0,.85);
}
.tile:hover{border-color:var(--edge);background:rgba(59,65,189,.5)}
.tile h2{
  margin:0;padding:5px 9px;font-size:14px;color:var(--gold);
  background:rgba(59,65,189,.5);border-bottom:1px solid var(--edge-soft);
  display:flex;justify-content:space-between;align-items:center;
}
.tile h2 .go{color:var(--ink-dim);font-size:12px;font-weight:normal}
.tile .in{padding:8px 9px;display:flex;gap:10px;flex:1;min-height:0}
.fillbar{height:14px;background:var(--slot);border:1px solid var(--edge-soft);position:relative}
.fillbar i{display:block;height:100%;background:linear-gradient(180deg,#9aa0ff,#5a60d8)}
.fillbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px}
.minislots{display:grid;grid-template-columns:repeat(6,24px);gap:3px}
.branchbar{display:grid;grid-template-columns:80px 1fr 34px;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim)}
.branchbar .track{height:10px;background:var(--slot);border:1px solid var(--edge-soft)}
.branchbar .track i{display:block;height:100%}

/* ---- item slots (shared) ----------------------------------------- */
.slot{
  width:100%;aspect-ratio:1;background:var(--slot);border:2px solid var(--edge-soft);
  display:grid;place-items:center;position:relative;
}
.slot.lit{background:var(--slot-lit);border-color:var(--edge)}
.slot .qty{position:absolute;right:2px;bottom:0;font-size:11px;color:#fff}
.gem{width:58%;height:58%;border:1px solid rgba(0,0,0,.55)}

/* ---- shared sub-view furniture ----------------------------------- */
.subhead{display:flex;align-items:center;gap:8px;padding:0 0 8px}
.subhead .grow{flex:1}
.subhead .who{font-size:15px;color:var(--gold)}
.subhead .count{font-size:12.5px;color:var(--ink-dim);font-weight:normal}
.wlbl{display:flex;border:1px solid var(--edge-soft)}
.wlbl button{
  font-family:var(--ui);font-weight:bold;font-size:12.5px;padding:4px 14px;cursor:pointer;
  background:var(--slot);color:var(--ink-mute);border:0;border-right:1px solid var(--edge-soft);
  text-shadow:2px 2px 0 rgba(0,0,0,.85);
}
.wlbl button:last-child{border-right:0}
.wlbl button:hover{background:var(--slot-lit);color:#fff}
.wlbl button[aria-pressed="true"]{background:var(--panel-lit);color:var(--gold)}
.hintbar{
  font-size:12.5px;color:var(--ink-dim);padding:6px 9px;font-weight:normal;
  background:var(--panel-sunk);border:1px solid var(--edge-soft);margin-bottom:8px;
}
.splitbody{display:flex;gap:10px;height:392px}
.gridbox{overflow-y:auto;background:var(--panel-sunk);border:1px solid var(--edge-soft);padding:9px}
/* Slots are a fixed 48px rather than a fraction of the panel: stretched to
   fill the width they came out four times Terraria's own slot and stopped
   reading as an inventory at all. The column count follows from the width. */
.grid4{display:grid;grid-template-columns:repeat(4,48px);gap:5px;align-content:start}
.grid8{display:grid;grid-template-columns:repeat(8,48px);gap:5px;align-content:start}
.grid10{display:grid;grid-template-columns:repeat(10,48px);gap:5px;align-content:start}
.classhead{display:grid;grid-template-columns:repeat(4,48px);gap:5px;padding:0 9px 4px;
  font-size:11px;color:var(--ink-mute);text-align:center;font-weight:normal}
.detail{
  flex:1;min-width:0;background:var(--panel-sunk);border:1px solid var(--edge-soft);
  padding:11px 13px;display:flex;flex-direction:column;gap:9px;
}
.detail h3{margin:0;font-size:16px}
.detail .cat{font-size:12.5px;color:var(--ink-mute);font-weight:normal}
.detail p{margin:0;font-size:13px;color:var(--ink-dim);line-height:1.55;font-weight:normal}
.detail .big{
  width:72px;height:72px;border:2px solid var(--edge-soft);background:var(--slot);
  display:grid;place-items:center;
}
.detail .big i{display:block;width:42px;height:42px;border:1px solid rgba(0,0,0,.55)}
.detail .empty{font-size:13px;color:var(--ink-mute);line-height:1.6;font-weight:normal}
.detail .act{
  font-family:var(--ui);font-weight:bold;font-size:13px;margin-top:auto;padding:6px 0;cursor:pointer;
  background:var(--panel-lit);border:1px solid var(--edge);color:var(--gold);
  text-shadow:2px 2px 0 rgba(0,0,0,.85);
}
.detail .act:hover{background:var(--slot-lit)}
.detail .act[disabled]{background:var(--slot);border-color:var(--edge-soft);color:var(--ink-mute);cursor:default}

/* Terraria-flavoured scrollbar rather than the operating system's */
.gridbox::-webkit-scrollbar{width:12px}
.gridbox::-webkit-scrollbar-track{background:var(--panel-sunk);border:1px solid var(--edge-soft)}
.gridbox::-webkit-scrollbar-thumb{background:var(--panel-lit);border:1px solid var(--edge)}

.ore{cursor:pointer}
.ore.picked{outline:3px solid var(--gold);outline-offset:-3px}
.ore.partial{opacity:.5;cursor:default}
.ore .lockbadge{position:absolute;left:2px;top:0;font-size:10px;color:var(--orange)}

/* tooltip: Terraria style, follows the cursor, no fade */
#tip{
  position:fixed;z-index:50;display:none;pointer-events:none;
  background:rgba(20,22,70,.96);border:2px solid var(--edge);padding:7px 9px;max-width:240px;
}
#tip .nm{font-size:14px;color:var(--ink)}
#tip .sub{font-size:12px;color:var(--ink-dim);margin-top:2px;font-weight:normal}
#tip .need{font-size:12px;color:var(--orange);margin-top:2px}

.placed{margin-top:6px;display:grid;gap:1px}
.placedlbl{font-size:11px;color:var(--ink-mute);margin-top:5px;font-weight:normal}

/* ---- mastery view ------------------------------------------------ */
.treewrap{height:392px;position:relative;overflow:hidden;background:rgba(14,16,58,.75);cursor:grab}
.treewrap.drag{cursor:grabbing}
.treewrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.node-c{cursor:pointer}
/* Chrome sits outside the pannable surface. Floated over it, the legend
   landed on a node label the moment the graph used its corners. */
.treefoot{
  display:flex;align-items:center;gap:16px;padding:7px 11px;
  background:rgba(59,65,189,.45);border-top:1px solid var(--edge-soft);
  font-size:12px;color:var(--ink-dim);
}
.treefoot .sp{flex:1}
.legend{display:flex;align-items:center;gap:6px}
.legend b{width:11px;height:11px;display:block;border:1px solid rgba(0,0,0,.6)}
.zoomhint{color:var(--ink-mute);font-weight:normal}
.nodeinfo{
  position:absolute;right:9px;top:9px;width:222px;
  background:rgba(20,22,70,.96);border:2px solid var(--edge);padding:9px 10px;
}
.nodeinfo h3{margin:0 0 4px;font-size:14px;color:var(--gold)}
.nodeinfo p{margin:0;font-size:12.5px;color:var(--ink-dim);line-height:1.5;font-weight:normal}
.nodeinfo .st{font-size:12px;margin-top:6px}
.nodeinfo button{
  font-family:var(--ui);font-weight:bold;font-size:12.5px;margin-top:7px;width:100%;padding:4px 0;
  cursor:pointer;background:var(--panel-lit);border:1px solid var(--edge);color:var(--gold);
  text-shadow:2px 2px 0 rgba(0,0,0,.85);
}
.nodeinfo button:hover{background:var(--slot-lit)}

/* ---- demo strip (not part of the game UI) ------------------------ */
.demo{
  width:880px;background:#14141c;border:1px solid #2c2c36;padding:9px 11px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:12.5px;color:#8a8a96;font-weight:normal;text-shadow:none;
}
.demo b{color:#c9c9d4;font-weight:bold}
.demo button{
  font-family:var(--ui);font-size:12.5px;padding:3px 10px;cursor:pointer;
  background:#1f1f28;border:1px solid #34343f;color:#c9c9d4;text-shadow:none;
}
.demo button:hover{background:#2a2a35;color:#fff}
.demo input[type=range]{width:110px;accent-color:#5f64c8}
</style>
</head>
<body>
<canvas id="world"></canvas>

<div class="card">
  <div class="titlebar">
    <button class="iconbtn" id="back" title="Back" style="display:none">&#8592;</button>
    <h1 id="cardtitle">Companion</h1>
    <span class="crumb" id="crumb"></span>
    <span class="spacer"></span>
    <button class="iconbtn" title="Close">&#10005;</button>
  </div>

  <!-- OVERVIEW ---------------------------------------------------- -->
  <div class="view on" id="v-overview">
    <div class="top">

      <div class="pane portrait">
        <h2>Companion</h2>
        <div class="frame"><canvas class="sprite" id="sprite" width="96" height="128"></canvas></div>
        <div class="nameplate">
          <div class="nm" id="cname">Companion</div>
          <div class="lv" id="clevel"></div>
        </div>
        <div class="hpwrap">
          <div class="hpbar"><i id="hpfill"></i><span id="hptext"></span></div>
        </div>
        <div class="action">
          <span class="k">Right now</span>
          <span class="v" id="actname"></span>
          <span class="why" id="actwhy"></span>
        </div>
      </div>

      <div class="pane behaviour">
        <h2>Behaviour</h2>
        <div class="body" id="behaviourbody"></div>
      </div>

    </div>
    <div class="bottom">

      <button class="tile" id="tile-inv">
        <h2>Cargo bag <span class="go">Open &#8594;</span></h2>
        <div class="in">
          <div style="flex:1;display:flex;flex-direction:column;gap:7px;justify-content:center">
            <div class="fillbar"><i id="invfill"></i><span id="invtext"></span></div>
            <div style="font-size:12px;color:var(--ink-dim);font-weight:normal" id="invnote"></div>
          </div>
          <div>
            <div style="font-size:11.5px;color:var(--ink-mute);margin-bottom:4px">Latest pickups</div>
            <div class="minislots" id="minislots"></div>
          </div>
        </div>
      </button>

      <button class="tile" id="tile-mastery">
        <h2>Mastery <span class="go">Open &#8594;</span></h2>
        <div class="in" style="flex-direction:column;gap:6px;justify-content:center" id="branchbars"></div>
      </button>

    </div>
  </div>

  <!-- CARGO BAG --------------------------------------------------- -->
  <div class="view" id="v-inventory">
    <div style="padding:10px">
      <div class="subhead">
        <div class="wlbl" id="invfilter">
          <button aria-pressed="true" data-f="all">All</button>
          <button aria-pressed="false" data-f="ore">Ore</button>
          <button aria-pressed="false" data-f="wood">Wood</button>
          <button aria-pressed="false" data-f="loot">Loot</button>
        </div>
        <span class="grow"></span>
        <span class="count" id="invcount"></span>
        <button class="wlbl" style="border:0"><span></span></button>
        <div class="wlbl"><button id="dumpbtn" aria-pressed="false">Hand everything over</button></div>
      </div>
      <div class="splitbody">
        <div class="gridbox"><div class="grid10" id="invgrid"></div></div>
        <div class="detail" id="invdetail"></div>
      </div>
    </div>
  </div>

  <!-- ACTIVITY DETAIL --------------------------------------------- -->
  <div class="view" id="v-activity">
    <div style="padding:10px">
      <div class="subhead">
        <span class="who" id="actTitle"></span>
        <span class="grow"></span>
        <div class="wlbl" id="wlblToggle">
          <button aria-pressed="true" data-m="wl">Whitelist</button>
          <button aria-pressed="false" data-m="bl">Blacklist</button>
        </div>
      </div>
      <div class="hintbar" id="orehint"></div>
      <div class="splitbody">
        <div class="gridbox"><div class="grid8" id="oregrid"></div></div>
        <div class="detail" id="oredetail"></div>
      </div>
    </div>
  </div>

  <!-- WEAPONS ----------------------------------------------------- -->
  <div class="view" id="v-weapons">
    <div style="padding:10px">
      <div class="subhead">
        <span class="who">Weapons</span>
        <span class="count" id="wepcount"></span>
        <span class="grow"></span>
      </div>
      <div class="hintbar" id="wephint"></div>
      <div class="splitbody">
        <div class="gridbox" style="padding-top:0">
          <div class="classhead" style="padding:8px 0 4px" id="wepclasshead"></div>
          <div class="grid4" id="wepgrid"></div>
        </div>
        <div class="detail" id="wepdetail"></div>
      </div>
    </div>
  </div>

  <!-- MASTERY ----------------------------------------------------- -->
  <div class="view" id="v-mastery">
    <div class="treewrap" id="treewrap">
      <svg id="tree"><g id="treeg"></g></svg>
      <div class="nodeinfo" id="nodeinfo" style="display:none"></div>
    </div>
    <div class="treefoot">
      <span class="legend"><b style="background:#8cf08c"></b> taken</span>
      <span class="legend"><b style="background:#ffe066"></b> available</span>
      <span class="legend"><b style="background:#4a4e8f"></b> locked</span>
      <span class="legend"><b style="background:#7ceaea;transform:rotate(45deg)"></b> opens its own tree</span>
      <span class="sp"></span>
      <span class="zoomhint">Drag to pan &middot; scroll to zoom</span>
    </div>
  </div>

</div>

<div class="demo">
  <b>Demo controls</b> &mdash; not part of the game UI
  <button id="d-action">Change current action</button>
  <label>Bag <input type="range" id="d-bag" min="0" max="40" value="26"></label>
  <label>Health <input type="range" id="d-hp" min="1" max="400" value="340"></label>
  <button id="d-points">Spend a mastery point</button>
</div>

<div id="tip"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Mock state, standing in for things the mod already has or plans: the
 * bag is Companion/Inventory, the action line is what BehaviourSelection
 * scored highest this tick, the work policies are the real WorkPolicy
 * enum, and the mastery points are the unbuilt tree the repository guide
 * names.
 * ------------------------------------------------------------------ */
const S = {
  name:'Companion', level:14, points:3,
  hp:340, hpMax:400,
  action:0,
  bag:26, bagMax:40,
  distance:1,
  wlMode:'wl',

};

/* ---- the world behind the panel ---------------------------------- */
function drawWorld(){
  const c = $('#world');
  const TS = 16, cols = Math.ceil(innerWidth / (TS * 3)) + 1, rows = Math.ceil(innerHeight / (TS * 3)) + 1;
  c.width = cols * TS; c.height = rows * TS;
  const x = c.getContext('2d');
  x.fillStyle = '#2a1f18'; x.fillRect(0, 0, c.width, c.height);   // dirt wall behind everything

  /* A deterministic scatter rather than Math.random, so the backdrop is the
     same on every load and a screenshot is comparable to the last one. */
  let seed = 20260910;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

  /* Terraria's tiles are legible from their grain, not their outline: every
     block carries speckle and a lit top edge, and without that a 48px square
     of flat colour reads as a wireframe rather than as dirt. */
  const grain = (tx, ty, base, light, dark) => {
    x.fillStyle = base; x.fillRect(tx, ty, TS, TS);
    for (let i = 0; i < 14; i++){
      x.fillStyle = rnd() > .5 ? light : dark;
      x.fillRect(tx + ((rnd() * TS) | 0), ty + ((rnd() * TS) | 0), 2, 2);
    }
    x.fillStyle = light; x.fillRect(tx, ty, TS, 2);
    x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(tx, ty + TS - 2, TS, 2);
  };

  for (let r = 0; r < rows; r++){
    for (let col = 0; col < cols; col++){
      const n = rnd();
      // a rough cave: the middle band is open wall, the top and bottom are tile
      const open = r > rows * .28 && r < rows * .78 && n > .18;
      if (open) continue;
      if (r < rows * .3)      grain(col*TS, r*TS, '#6b4a2f', '#8a6440', '#4d3320');   // surface dirt
      else if (n > .62)       grain(col*TS, r*TS, '#6f6f7c', '#8d8d9c', '#4e4e5a');   // stone
      else                    grain(col*TS, r*TS, '#5f452e', '#7c5a3c', '#432f1f');   // cave dirt
      if (n > .965){                                                                  // an ore speck
        x.fillStyle = n > .985 ? '#c87f4a' : '#b4b0a6';
        x.fillRect(col*TS + 4, r*TS + 4, 5, 5);
        x.fillRect(col*TS + 9, r*TS + 8, 4, 4);
      }
    }
  }
  x.fillStyle = 'rgba(6,8,26,.5)'; x.fillRect(0, 0, c.width, c.height);   // darken so the UI reads
}

     whether it fights, whether it carries a torch, whether it grabs drops —

  note.textContent = 'Fighting, dodging, carrying a light and picking things up are not settings. '
    + 'The companion scores those against each other every tick and does whichever is worth most '
    + 'right now — which is what the line under its portrait is showing you.';
  b.appendChild(note);
}

/* What the companion will do with a stack, which is the reason this panel
   is worth its half of the view: the bag is the companion's, so the real
   question about any stack is whether it will keep collecting this. */
function itemNote(it){
  if (S.bag >= S.bagMax) return 'The bag is full, so nothing more of this is being picked up.';
  if (it[2] === 'ore') return 'Mined by the companion and kept. Handed over when you ask.';
  if (it[2] === 'wood') return 'Chopped by the companion and kept. A chopping run produces stacks of this.';
  return 'Picked up off the ground while gathering is on.';
}

}

function renderInventory(){
  const g = $('#invgrid'); g.innerHTML = '';
  const shown = ITEMS.filter(i => invFilter === 'all' || i[2] === invFilter).slice(0, S.bag);
  shown.forEach(it => {
    const s = el('div','slot');
    const gem = el('div','gem'); gem.style.background = it[1];
    s.appendChild(gem);
    const q = el('span','qty'); q.textContent = it[3]; s.appendChild(q);
    /* No wall preview here: a bag stack is an item, and "how it looks in the
       wall" is only meaningful in the mining whitelist, where recognising the
       ore while digging is the actual task. */
    s.onmouseenter = e => { invHover = it; renderInvDetail(); showTip(e, it[0], CATNAME[it[2]] + ' · ' + it[3]); };
    s.onmousemove = moveTip; s.onmouseleave = hideTip;
    g.appendChild(s);
  });
  for (let i = shown.length; i < S.bagMax; i++) g.appendChild(el('div','slot'));
  $('#invcount').textContent = shown.length + ' stacks shown · ' + (S.bagMax - S.bag) + ' slots free';
  renderInvDetail();
}

/* ---- activity detail: the ore whitelist -------------------------- */
let oreHover = null;

/* The wall preview, built once and reused. It is the form the player has to
   spot while digging; an item icon never teaches that. */
function wallSwatch(col, cell){
  let h = '<div class="placed" style="grid-template-columns:repeat(4,' + cell + 'px)">';
  for (let i = 0; i < 16; i++){
    const isOre = [1,2,5,6,9,10,13].includes(i);
    h += '<i style="display:block;width:' + cell + 'px;height:' + cell + 'px;background:'
       + (isOre ? col : '#4a3828') + '"></i>';
  }
  return h + '</div>';
}

function renderOreDetail(){
  const d = $('#oredetail');
  if (!oreHover){
    d.innerHTML = '<div class="empty">Hover an ore to read it. Click an unlocked one to '
      + (S.wlMode === 'wl' ? 'put it on the whitelist.' : 'put it on the blacklist.')
      + '<br><br>An ore only appears here once the companion has mined it at least once, '
      + 'so this grid grows as you explore rather than listing the whole game up front.</div>';
    return;
  }
  const o = oreHover, done = o.mined >= o.need, chosen = orePicked.has(o.name);
  let state;
  if (!done) state = '<span style="color:var(--orange)">Mine ' + (o.need - o.mined) + ' more to choose this</span>';
  else if (S.wlMode === 'wl') state = chosen
    ? '<span style="color:var(--green)">On the whitelist — the companion mines this</span>'
    : '<span style="color:var(--ink-mute)">Not on the whitelist — left in the wall</span>';
  else state = chosen
    ? '<span style="color:var(--red)">On the blacklist — left in the wall</span>'
    : '<span style="color:var(--green)">Not blacklisted — the companion mines this</span>';
  d.innerHTML = '<div><h3 style="color:' + o.col + '">' + o.name + '</h3>'
    + '<div class="cat">' + o.mined + ' mined so far</div></div>'
    + '<p>' + state + '</p>'
    + wallSwatch(o.col, 20) + '<div class="placedlbl">how it looks in the wall</div>';
}

function renderOres(){
  const g = $('#oregrid'); g.innerHTML = '';
  $('#actTitle').textContent = S.activity;
  $('#orehint').textContent = S.wlMode === 'wl'
    ? 'Whitelist — it mines only what is selected here. Nothing selected means it mines nothing on its own.'
    : 'Blacklist — it mines anything except what is selected here. Nothing selected means it mines everything.';
  ORES.filter(o => o.mined > 0).forEach(o => {
    const done = o.mined >= o.need;
    const s = el('div', 'slot ore' + (done ? '' : ' partial') + (done && orePicked.has(o.name) ? ' picked' : ''));
    const gem = el('div','gem');
    gem.style.background = o.col;
    gem.style.clipPath = 'polygon(50% 0,100% 34%,82% 100%,18% 100%,0 34%)';
    s.appendChild(gem);
    if (!done){ const b = el('span','lockbadge'); b.textContent = o.mined + '/' + o.need; s.appendChild(b); }
    s.onmouseenter = e => {
      oreHover = o; renderOreDetail();
      /* No wall preview in the tooltip: the panel beside the grid already
         shows it, and two copies of one swatch under the cursor is noise. */
      showTip(e, o.name, done ? 'Unlocked' : null,
        done ? null : 'Mine ' + (o.need - o.mined) + ' more to choose this');
    };
    s.onmousemove = moveTip; s.onmouseleave = hideTip;
    if (done) s.onclick = () => {
      orePicked.has(o.name) ? orePicked.delete(o.name) : orePicked.add(o.name);
      renderOres();
    };
    g.appendChild(s);
  });
  renderOreDetail();
}

/* ---- weapons: a loadout picker, not a list of what it owns -------- */
let wepHover = null;

function setActive(w){
  const i = active.indexOf(w.n);
  if (i >= 0){ active.splice(i, 1); }
  /* Two slots, so picking a third replaces the one picked longest ago rather
     than refusing the click. A refusal makes the player guess which of the
     two to drop first, which is two clicks to do one thing. */
  else { if (active.length >= ACTIVE_MAX) active.shift(); active.push(w.n); }
  renderWeapons(); renderBehaviour();
}

function renderWepDetail(){
  const d = $('#wepdetail');
  if (!wepHover){
    d.innerHTML = '<div class="empty">Hover a weapon to read it. Click an unlocked one to carry it.'
      + '<br><br>The companion carries two at a time and picks between them per shot, so the pair '
      + 'is the choice — one for a single target and one for a crowd covers most of a run.'
      + '<br><br>A locked weapon is one the mastery tree has not bought yet.</div>';
    return;
  }
  const w = wepHover, on = active.includes(w.n);
  d.innerHTML = '<div class="big"><i style="background:' + RARITY[w.t] + '"></i></div>'
    + '<div><h3 style="color:' + RARITY[w.t] + '">' + w.n + '</h3>'
    + '<div class="cat">' + w.c[0].toUpperCase() + w.c.slice(1) + ' · ' + TIERNAME[w.t] + '</div></div>'
    + '<p>' + w.d + '</p>'
    + '<p>' + (!w.got
        ? '<span style="color:var(--orange)">Locked — unlock it in the mastery tree</span>'
        : on ? '<span style="color:var(--green)">Carried right now</span>'
             : '<span style="color:var(--ink-mute)">Owned, not carried</span>') + '</p>';
  const btn = el('button','act');
  btn.textContent = !w.got ? 'Locked'
    : on ? 'Put it away'
    : (active.length >= ACTIVE_MAX ? 'Carry it instead of ' + active[0] : 'Carry it');
  if (!w.got) btn.disabled = true; else btn.onclick = () => setActive(w);
  d.appendChild(btn);
}

/* The grid is the design matrix itself: a row is a tier, a column is a class.
   Laid out as one continuous run of slots the tier boundaries fell mid-row and
   the ladder — the one thing this grid exists to show — stopped being visible.
   A tier with no weapon in a class leaves that cell empty on purpose, which is
   how the starting kit reads as two weapons rather than as a short row. */
const CLASSES = ['melee','ranger','rogue','mage'];

function renderWeapons(){
  const g = $('#wepgrid'); g.innerHTML = '';
  const ch = $('#wepclasshead'); ch.innerHTML = '';
  CLASSES.forEach(c => { const s = el('span'); s.textContent = c[0].toUpperCase() + c.slice(1); ch.appendChild(s); });

  /* The carried pair, shown while you choose. Picking a loadout is a decision
     about the pair rather than about one weapon — one for a single target and
     one for a crowd — so the other half has to be on screen while you pick. */
  $('#wepcount').innerHTML = 'Carrying &nbsp;' + Array.from({ length:ACTIVE_MAX }, (_, i) => {
    const w = active[i] && WEAPONS.find(x => x.n === active[i]);
    return w
      ? '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:10px">'
        + '<i style="width:14px;height:14px;display:inline-block;border:1px solid rgba(0,0,0,.6);'
        + 'background:' + RARITY[w.t] + '"></i>'
        + '<b style="color:' + RARITY[w.t] + '">' + w.n + '</b></span>'
      : '<span style="margin-right:10px;color:var(--ink-mute)">empty slot</span>';
  }).join('');
  $('#wephint').textContent = 'The companion carries ' + ACTIVE_MAX
    + ' weapons and chooses between them shot by shot. Everything else it owns stays put away.';

  Object.keys(TIERNAME).forEach(tier => {
    const head = el('div');
    head.style.cssText = 'grid-column:1/-1;font-size:11.5px;color:' + RARITY[tier]
      + ';margin:7px 0 1px;opacity:.9;font-weight:normal';
    head.textContent = TIERNAME[tier];
    g.appendChild(head);

    CLASSES.forEach(cls => {
      const w = WEAPONS.find(x => x.t === tier && x.c === cls);
      if (!w){ const blank = el('div','slot'); blank.style.opacity = '.25'; g.appendChild(blank); return; }
      const on = active.includes(w.n);
      const s = el('div', 'slot ore' + (w.got ? '' : ' partial') + (on ? ' picked' : ''));
      const gem = el('div','gem');
      /* A locked weapon keeps its rarity colour and only loses brightness, so
         the ladder stays readable before anything on it is owned. */
      gem.style.background = RARITY[w.t];
      s.appendChild(gem);
      if (!w.got){ const b = el('span','lockbadge'); b.textContent = '✕'; s.appendChild(b); }
      s.onmouseenter = e => {
        wepHover = w; renderWepDetail();
        showTip(e, w.n, w.c[0].toUpperCase() + w.c.slice(1) + ' · ' + TIERNAME[w.t],
          w.got ? null : 'Locked — unlock it in the mastery tree');
      };
      s.onmousemove = moveTip; s.onmouseleave = hideTip;
      if (w.got) s.onclick = () => setActive(w);
      g.appendChild(s);
    });
  });
  renderWepDetail();
}

/* ---- tooltip ----------------------------------------------------- */
function showTip(e, name, sub, need){
  const t = $('#tip');
  let h = '<div class="nm">' + name + '</div>';
  if (sub) h += '<div class="sub">' + sub + '</div>';
  if (need) h += '<div class="need">' + need + '</div>';
  t.innerHTML = h; t.style.display = 'block'; moveTip(e);
}
function moveTip(e){
  const t = $('#tip');
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + t.offsetWidth > innerWidth - 8) x = e.clientX - t.offsetWidth - 12;
  if (y + t.offsetHeight > innerHeight - 8) y = e.clientY - t.offsetHeight - 12;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideTip(){ $('#tip').style.display = 'none'; }

/* ---- mastery tree ------------------------------------------------ */
const view = { x:0, y:0, k:1, tree:'main', stack:[] };
const COL = { taken:'#8cf08c', avail:'#ffe066', lock:'#4a4e8f' };
const currentTree = () => view.tree === 'main' ? TREE_MAIN : SUBTREES[view.tree];

function renderTree(){
  const t = currentTree(), g = $('#treeg');
  g.innerHTML = '';
  const box = $('#treewrap').getBoundingClientRect();
  g.setAttribute('transform', 'translate(' + (box.width/2 + view.x) + ',' + (box.height/2 + view.y)
    + ') scale(' + view.k + ')');
  const byId = {}; t.nodes.forEach(n => byId[n.id] = n);

  t.edges.forEach(([a, b]) => {
    const A = byId[a], B = byId[b];
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', A.x); line.setAttribute('y1', A.y);
    line.setAttribute('x2', B.x); line.setAttribute('y2', B.y);
    line.setAttribute('stroke', B.state === 'lock' ? '#2d3068' : (B.state === 'taken' ? '#4a7f52' : '#7a6b3a'));
    line.setAttribute('stroke-width', 4);
    g.appendChild(line);
  });

  t.nodes.forEach(n => {
    const r = n.r || 17;
    let shape;
    if (n.shape === 'd'){
      shape = document.createElementNS('http://www.w3.org/2000/svg','rect');
      shape.setAttribute('x', -r); shape.setAttribute('y', -r);
      shape.setAttribute('width', r*2); shape.setAttribute('height', r*2);
      shape.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ') rotate(45)');
    } else {
      shape = document.createElementNS('http://www.w3.org/2000/svg','circle');
      shape.setAttribute('cx', n.x); shape.setAttribute('cy', n.y); shape.setAttribute('r', r);
    }
    shape.setAttribute('fill', n.state === 'lock' ? '#1e2050' : '#2b3099');
    shape.setAttribute('stroke', n.shape === 'd' && n.state !== 'lock' ? '#7ceaea' : COL[n.state]);
    shape.setAttribute('stroke-width', n.shape === 'd' ? 4 : 3.5);
    shape.setAttribute('class','node-c');
    shape.onclick = ev => { ev.stopPropagation(); pickNode(n); };
    g.appendChild(shape);

    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', n.x); label.setAttribute('y', n.y + r + 16);
    label.setAttribute('text-anchor','middle');
    label.setAttribute('fill', n.state === 'lock' ? '#5b5f9a' : '#d5d8ff');
    label.setAttribute('font-size','12.5');
    label.setAttribute('font-family','Trebuchet MS, sans-serif');
    label.setAttribute('font-weight','bold');
    label.setAttribute('style','text-shadow:2px 2px 0 rgba(0,0,0,.85)');
    label.textContent = n.name;
    g.appendChild(label);
  });
}

function pickNode(n){
  const box = $('#nodeinfo');
  const st = n.state === 'taken' ? '<span style="color:var(--green)">Taken</span>'
    : n.state === 'avail' ? '<span style="color:var(--gold)">Available — costs 1 point</span>'
    : '<span style="color:var(--ink-mute)">Locked — take the node before it first</span>';
  let h = '<h3>' + n.name + '</h3><p>' + n.desc + '</p><div class="st">' + st + '</div>';
  /* A diamond can be both unspent and enterable, so it gets both buttons —
     showing only the drill-down left the card claiming a cost with nothing
     to pay it with. */
  if (n.state === 'avail' && S.points > 0) h += '<button data-take="' + n.id + '">Spend a point</button>';
  if (n.sub && n.state !== 'lock') h += '<button data-sub="' + n.sub + '">Open its tree →</button>';
  box.innerHTML = h; box.style.display = 'block';

  const sub = box.querySelector('[data-sub]');
  if (sub) sub.onclick = () => {
    view.stack.push(view.tree); view.tree = sub.dataset.sub;
    view.x = 0; view.y = 0; view.k = 1;
    box.style.display = 'none'; setTitle(); renderTree();
  };
  const take = box.querySelector('[data-take]');
  if (take) take.onclick = () => {
    n.state = 'taken'; S.points--;
    currentTree().edges.filter(e => e[0] === n.id).forEach(e => {
      const nx = currentTree().nodes.find(m => m.id === e[1]);
      if (nx && nx.state === 'lock') nx.state = 'avail';
    });
    renderHeader(); renderTree(); pickNode(n);
  };
}

(function treeControls(){
  const w = $('#treewrap');
  let drag = false, sx = 0, sy = 0;
  w.addEventListener('mousedown', e => { drag = true; sx = e.clientX - view.x; sy = e.clientY - view.y; w.classList.add('drag'); });
  addEventListener('mouseup', () => { drag = false; w.classList.remove('drag'); });
  addEventListener('mousemove', e => { if (!drag) return; view.x = e.clientX - sx; view.y = e.clientY - sy; renderTree(); });
  w.addEventListener('wheel', e => {
    e.preventDefault();
    view.k = Math.max(.4, Math.min(2.4, view.k * (e.deltaY < 0 ? 1.12 : 1/1.12)));
    renderTree();
  }, { passive:false });
  w.addEventListener('click', () => { $('#nodeinfo').style.display = 'none'; });
})();

/* ---- view switching ---------------------------------------------- */
let current = 'overview';
function setTitle(){
  const crumb = { overview:'', inventory:'› Cargo bag', activity:'› ' + S.activity,
                  weapons:'› Weapons', mastery:'› ' + currentTree().title };
  $('#crumb').textContent = crumb[current];
  $('#back').style.display = current === 'overview' ? 'none' : 'grid';
}
function show(v){
  $$('.view').forEach(x => x.classList.remove('on'));
  $('#v-' + v).classList.add('on');
  current = v; setTitle(); hideTip();
  if (v === 'mastery') renderTree();
  if (v === 'inventory') renderInventory();
  if (v === 'activity') renderOres();
  if (v === 'weapons') renderWeapons();
}
function openActivity(name){ S.activity = name; show('activity'); }

$('#back').onclick = () => {
  if (current === 'mastery' && view.stack.length){
    view.tree = view.stack.pop(); view.x = 0; view.y = 0; view.k = 1;
    $('#nodeinfo').style.display = 'none'; setTitle(); renderTree(); return;
  }
  show('overview');
};
$('#tile-inv').onclick = () => show('inventory');
$('#tile-mastery').onclick = () => {
  view.tree = 'main'; view.stack = []; view.x = 0; view.y = 0; view.k = 1;
  $('#nodeinfo').style.display = 'none'; show('mastery');
};
$('#invfilter').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  invFilter = b.dataset.f;
  [...e.currentTarget.children].forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  renderInventory();
};
$('#wlblToggle').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.wlMode = b.dataset.m;
  [...e.currentTarget.children].forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  renderOres();
};
$('#dumpbtn').onclick = () => { S.bag = 0; renderInventory(); renderTiles(); $('#d-bag').value = 0; };

/* ---- demo strip --------------------------------------------------- */
$('#d-action').onclick = () => { S.action = (S.action + 1) % ACTIONS.length; renderHeader(); };
$('#d-bag').oninput = e => { S.bag = +e.target.value; renderTiles(); if (current === 'inventory') renderInventory(); };
$('#d-hp').oninput = e => { S.hp = +e.target.value; renderHeader(); };
$('#d-points').onclick = () => { S.points++; renderHeader(); };

drawWorld(); drawSprite(); renderHeader(); renderBehaviour(); renderTiles(); setTitle();
addEventListener('resize', () => { drawWorld(); if (current === 'mastery') renderTree(); });
</script>
</body>
